<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp - Buscador de Películas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado y Buscador -->
    <header>
        <div class="logo">🎬 CineApp</div>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Buscar película..." autocomplete="off">
            <button type="submit">Buscar</button>
        </form>
    </header>

    <!-- Barra de Filtros Rápido -->
    <nav class="filters">
        <button class="filter-btn active" data-type="popular">🔥 Populares</button>
        <button class="filter-btn" data-type="top_rated">⭐ Mejor Valoradas</button>
        <button class="filter-btn" data-type="upcoming">🍿 Próximamente</button>
    </nav>

    <!-- Contenedor Principal de Películas -->
    <main id="movies-grid" class="movies-grid">
        <!-- Las películas se cargarán aquí dinámicamente desde JavaScript -->
    </main>

    <!-- Modal de Detalles (Se abrirá al hacer clic en una tarjeta) -->
    <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body">
                <!-- Información detallada de la película seleccionada -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
